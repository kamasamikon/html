<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6a5cff">
    <title>单词连连看</title>
    <style>
        :root {
            --brand: #6a5cff;
            --brand-2: #9b6bff;
            --ok: #22c55e;
            --ok-2: #16a34a;
            --err: #ef4444;
            --ink: #1f2333;
            --ink-soft: #6b7192;
            --line: #e7e9f5;
            --card: rgba(255, 255, 255, 0.82);
            --shadow: 0 10px 30px rgba(60, 50, 130, 0.12);
            --radius: 16px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background:
                radial-gradient(1200px 600px at 10% -10%, #e9e4ff 0%, transparent 55%),
                radial-gradient(1000px 500px at 110% 10%, #dff1ff 0%, transparent 50%),
                linear-gradient(160deg, #f4f1ff 0%, #eef4ff 45%, #f6f7fb 100%);
            background-attachment: fixed;
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* 卡片：移动端铺满屏幕，桌面上限宽居中 */
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: var(--card);
            backdrop-filter: blur(14px) saturate(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(1.1);
            padding: clamp(10px, 3.2vw, 22px);
            border-radius: clamp(0px, 4vw, 22px);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            overflow: hidden;
        }
        @media (min-width: 820px) {
            .container {
                min-height: auto;
                height: calc(100dvh - 32px);
                margin: 16px 0;
                border-radius: 22px;
            }
        }

        /* ===== 游戏区：拿走所有剩余空间，成为视觉主角 ===== */
        #gameSection {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
        }
        #gameSection.hidden {
            display: none;
        }
        .game-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 2.6vw, 20px);
            margin-bottom: 0;
            min-height: 0;
        }
        .column {
            display: grid;
            grid-template-rows: repeat(10, 1fr);
            gap: clamp(4px, 1.4vw, 8px);
            min-height: 0;
        }
        .column#englishColumn {
            animation: slideInLeft 0.45s cubic-bezier(.22,.9,.3,1) both;
        }
        .column#chineseColumn {
            animation: slideInRight 0.45s cubic-bezier(.22,.9,.3,1) both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(18px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ===== 单词按钮 ===== */
        .word-button {
            position: relative;
            padding: 6px 8px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            border-radius: clamp(8px, 2.4vw, 13px);
            font-size: clamp(13px, 3.9vw, 18px);
            font-weight: 600;
            letter-spacing: 0.2px;
            min-height: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.15;
            overflow-wrap: anywhere;
            box-shadow: 0 2px 6px rgba(50, 40, 110, 0.06);
            transition: transform .16s cubic-bezier(.2,.8,.3,1.2),
                        background .2s, color .2s, box-shadow .2s, border-color .2s, opacity .25s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        .word-button:hover {
            background: #f6f4ff;
            border-color: #d9d3ff;
            transform: translateY(-1px);
        }
        .word-button:active {
            transform: scale(0.95);
            box-shadow: 0 1px 3px rgba(50, 40, 110, 0.10);
        }
        /* 选中：品牌紫 + 辉光 */
        .word-button.selected {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff;
            border-color: transparent;
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 6px 18px rgba(106, 92, 255, 0.45);
            animation: pulseGlow 1.1s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 6px 18px rgba(106, 92, 255, 0.40); }
            50%      { box-shadow: 0 6px 26px rgba(106, 92, 255, 0.68); }
        }
        /* 匹配成功：绿色 + 对勾 + 弹一下 */
        .word-button.matched {
            background: linear-gradient(135deg, var(--ok) 0%, var(--ok-2) 100%);
            color: #fff;
            border-color: transparent;
            cursor: not-allowed;
            opacity: 0.85;
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.30);
            animation: popOk 0.42s cubic-bezier(.2,.9,.3,1.3);
        }
        .word-button.matched::after {
            content: "✓";
            position: absolute;
            top: 3px;
            right: 5px;
            font-size: 0.72em;
            font-weight: 700;
            opacity: 0.9;
        }
        @keyframes popOk {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.14); }
            100% { transform: scale(1); }
        }
        /* 匹配失败：红色抖动（由新增的视觉钩子 class 触发） */
        .word-button.wrong {
            background: linear-gradient(135deg, #ff6b6b 0%, var(--err) 100%);
            color: #fff;
            border-color: transparent;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-6px); }
            30% { transform: translateX(6px); }
            45% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        /* ===== 底部信息条 ===== */
        .hint {
            position: relative;
            font-size: clamp(10px, 2.9vw, 12px);
            color: var(--ink-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: clamp(10px, 3vw, 14px);
            padding-top: clamp(10px, 3vw, 14px);
            border-top: 1px dashed var(--line);
        }
        .hint .btn-flat {
            font-size: inherit;
        }

        /* 进度条：用伪元素画在分隔线上，不新增任何 DOM 节点 */
        .hint::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -1px;
            height: 3px;
            border-radius: 99px;
            background: #eceafb;
            overflow: hidden;
        }
        .hint::after {
            content: "";
            position: absolute;
            left: 0;
            top: -1px;
            height: 3px;
            width: var(--progress, 0%);
            max-width: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--brand), var(--ok));
            transition: width .5s cubic-bezier(.2,.8,.3,1);
            pointer-events: none;
        }

        /* ===== 按钮 ===== */
        .btn {
            padding: 7px 16px;
            margin: 4px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: clamp(11px, 3vw, 12px);
            font-weight: 600;
            font-family: inherit;
            transition: transform .15s, box-shadow .2s, filter .2s;
            -webkit-user-select: none;
            user-select: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff;
            box-shadow: 0 4px 12px rgba(106, 92, 255, 0.35);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--ok), var(--ok-2));
            color: #fff;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.30);
            white-space: nowrap;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6161, var(--err));
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.30);
        }
        .btn-flat {
            background: none;
            cursor: auto;
            padding: 4px 2px;
            margin: 0;
            box-shadow: none;
        }
        .btn-flat:active { transform: none; }
        .btn-flat a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        /* 计数徽章 */
        #matchedCount, #totalCount {
            font-weight: 700;
            color: var(--brand);
        }
        #matchedCount {
            display: inline-block;
            min-width: 1.6em;
            text-align: center;
            padding: 0 4px;
            border-radius: 6px;
            background: #efedff;
            transition: transform .3s;
        }
        #matchedCount.bump {
            animation: bump 0.4s cubic-bezier(.2,.9,.3,1.4);
        }
        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.45); color: var(--ok-2); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        /* ===== 底部控制区：把原来的 6 个 <br> 换成弹性留白 ===== */
        .controls {
            text-align: center;
            flex: 0 0 auto;
            min-height: clamp(48px, 14vh, 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: clamp(6px, 2vw, 14px);
        }
        .controls br { display: none; }
        #dangerAction {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            animation: rise 0.3s cubic-bezier(.2,.9,.3,1.2);
        }
        #dangerAction.hidden { display: none !important; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #startGame.btn:not(.hidden) {
            animation: breathe 1.6s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 4px 12px rgba(106, 92, 255, 0.35); }
            50%      { box-shadow: 0 4px 22px rgba(106, 92, 255, 0.65); }
        }

        hr.shadow {
            border: none;
            height: 1px;
            background: var(--line);
            box-shadow: 0 1px 3px rgba(60, 50, 130, 0.06);
        }

        /* 未开始时：占位提示，让首屏不空 */
        .container:has(#gameSection.hidden) .controls {
            justify-content: center;
            flex: 1 1 auto;
        }
        .container:has(#gameSection.hidden) .controls::before {
            content: "加载词库中…";
            font-size: clamp(12px, 3.4vw, 14px);
            color: var(--ink-soft);
            letter-spacing: 1px;
            animation: blink 1.4s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: .45; }
            50%      { opacity: 1; }
        }

        /* 屏幕轻微反馈（桌面端退化震动时用，移动端不闪） */
        @keyframes nudge {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(2px, 0); }
            75% { transform: translate(-2px, 0); }
        }
        body.nudge { animation: nudge 0.12s ease; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 横屏手机：进一步压缩上下留白，把高度让给按钮 */
        @media (orientation: landscape) and (max-height: 500px) {
            .hint { margin-top: 6px; padding-top: 6px; }
            .controls { min-height: 40px; }
            .word-button { font-size: clamp(12px, 2.6vw, 15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="gameSection" class="hidden">
            <div class="game-area">
                <div class="column" id="englishColumn"></div>
                <div class="column" id="chineseColumn"></div>
            </div>
        </div>
        <div class="hint" style="display:flex;justify-content: space-between;">
            <button class="btn btn-flat" id="baseInfo"></button>
            <button class="btn btn-success" onclick="exportWords()">导出已掌握的单词</button>
            <button class="btn btn-flat">已记住了: <span id="matchedCount">0</span> / <span id="totalCount">0</span></button>
        </div>
        <div class="controls">
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <div id="dangerAction" class="hidden">
                <button id="clearMemory" class="btn btn-danger" onclick="clearMemory()">删除所有背过单词的记录</button>
                <button id="startGame" class="btn btn-primary hidden" onclick="startGame()">开始</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let dictName = urlParams.get('dict') || "auvaa";
        let userName = urlParams.get('user') || "user";

        const fn = window.location.pathname.split('/').filter(Boolean).pop() || ''; 
        const path = fn.split(".")[0];
        const segs = path.split("_");
        if (segs.length > 2) {
            userName = segs[2];
        }
        if (segs.length > 1) {
            dictName = segs[1];
        }

        document.getElementById("baseInfo").innerHTML = "dict: <a href='https://webnote.cc/" + dictName + "'>" + dictName + "</a>, user: " + userName;

        let wordPairs = [];
        let selectedButtons = [];
        let matchedWords = new Set();

        // 模拟获取单词中文意思
        function getChineseMeaning(word) {
            return document.dict[word.toLowerCase()] || word;
        }

        const clickTimes = [];
        const maxInterval = 500; // 每次点击间隔上限
        const requiredClicks = 5; // 要求连续点击次数

        document.addEventListener('click', () => {
            const now = Date.now();
            clickTimes.push(now);

            // 只保留最近几次点击
            if (clickTimes.length > requiredClicks) {
                clickTimes.shift();
            }

            if (clickTimes.length === requiredClicks) {
                const intervals = clickTimes.slice(1).map((t, i) => t - clickTimes[i]);
                if (intervals.every(diff => diff > 0 && diff < maxInterval)) {
                    clickTimes.length = 0;

                    document.getElementById('dangerAction').classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('dangerAction').classList.add('hidden');
                    }, 10000);
                }
            }
        });

        function base64ToUtf8(base64Str) {
            try {
                // Step 1: Base64 → 二进制字符串（每个字符代表一个字节）
                const binaryStr = atob(base64Str);

                // Step 2: 将二进制字符串转为 Uint8Array（字节数组）
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }

                // Step 3: 用 UTF-8 解码字节数组
                const decoder = new TextDecoder('utf-8');
                return decoder.decode(bytes);
            } catch (e) {
                // console.error('Base64 解码失败:', e);
                return null;
            }
        }

        // 用'https://api-webnote.txttool.cn/netcut/note/info/', api.txttool.cn 已经不能用了。
        async function fetchNoteInfo(noteName) {
            try {
                const resp = await fetch('https://api-webnote.txttool.cn/netcut/note/info/', {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json, text/javascript, */*; q=0.01',
                        'content-type': 'application/x-www-form-urlencoded; charset=UTF-8'
                    },
                    body: new URLSearchParams({ note_name: noteName })
                });
                if (!resp.ok) {
                    return;
                }
                const data = await resp.json();
                const content = JSON.parse(data.data.note_content)[0].content;
                let dictText = base64ToUtf8(content);
                if (dictText == null) {
                    dictText = content;
                }
                const wordArray = dictText.trim().split(/\r?\n/);
                document.dict = Object.fromEntries(wordArray.map(s => s.split(':').map(p => p.trim())));
                console.log(document.dict);
                startGame();
            } catch (err) {
                console.log(err);
            }
        }

        // 从localStorage加载已记住的单词
        function loadMatchedWords() {
            const saved = localStorage.getItem('matchedWords_'+userName);
            if (saved) {
                matchedWords = new Set(JSON.parse(saved));
            }
        }

        // 保存已记住的单词到localStorage
        function saveMatchedWords() {
            localStorage.setItem('matchedWords_'+userName, JSON.stringify([...matchedWords]));
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1)); // 0 ≤ j ≤ i
                [arr[i], arr[j]] = [arr[j], arr[i]];           // ES6 解构交换
            }
            return arr;
        }

        // 开始游戏
        function startGame() {
            loadMatchedWords();

            const words = Object.keys(document.dict);
            const newWords = shuffle(words.filter(word => !matchedWords.has(word)));

            if (newWords.length < 2) {
                alert('没有新单词可以学习！');
                return;
            }

            // 选择最多20个单词（10对）
            const selectedWords = newWords.slice(0, 10);
            wordPairs = selectedWords.map(word => ({
                english: word,
                chinese: getChineseMeaning(word)
            }));

            renderGame();
            document.getElementById('gameSection').classList.remove('hidden');
        }

        // 渲染游戏界面
        function renderGame() {
            const englishCol = document.getElementById('englishColumn');
            const chineseCol = document.getElementById('chineseColumn');

            englishCol.innerHTML = '';
            chineseCol.innerHTML = '';

            // 随机排序
            const shuffledEng = [...wordPairs].sort(() => Math.random() - 0.5);
            const shuffledChi = [...wordPairs].sort(() => Math.random() - 0.5);

            // 渲染英文按钮
            shuffledEng.forEach(pair => {
                const btn = document.createElement('button');
                btn.className = 'word-button';
                btn.textContent = pair.english;
                btn.dataset.word = pair.english;
                btn.dataset.type = 'english';
                btn.onclick = () => selectButton(btn);
                englishCol.appendChild(btn);
            });

            // 渲染中文按钮
            shuffledChi.forEach(pair => {
                const btn = document.createElement('button');
                btn.className = 'word-button';
                btn.textContent = pair.chinese;
                btn.dataset.word = pair.english;
                btn.dataset.type = 'chinese';
                btn.onclick = () => selectButton(btn);
                chineseCol.appendChild(btn);
            });

            updateCounts();
        }

        // 选择按钮
        function selectButton(button) {
            if (button.classList.contains('matched')) return;

            // 如果已经有两个选中，先清除
            if (selectedButtons.length >= 2) {
                selectedButtons.forEach(btn => btn.classList.remove('selected'));
                selectedButtons = [];
            }

            button.classList.add('selected');
            selectedButtons.push(button);

            // 检查是否匹配
            if (selectedButtons.length === 2) {
                checkMatch();
            }
        }

        // 检查匹配
        function checkMatch() {
            const [btn1, btn2] = selectedButtons;

            // 确保选中了英文和中文各一个
            if (btn1.dataset.type === btn2.dataset.type) {
                setTimeout(() => {
                    selectedButtons.forEach(btn => btn.classList.remove('selected'));
                    selectedButtons = [];
                }, 100);
                return;
            }

            const word = btn1.dataset.word === btn2.dataset.word ? btn1.dataset.word : null;

            if (word) {
                // 匹配成功
                selectedButtons.forEach(btn => {
                    btn.classList.remove('selected');
                    btn.classList.add('matched');
                });

                matchedWords.add(word);
                saveMatchedWords();

                updateCounts();

                // 视觉/振动反馈：匹配成功
                buzz([18, 40, 18]);
                pulseCount();

                // 检查是否需要重新加载
                const matchedButtons = document.querySelectorAll('.word-button.matched');
                if (matchedButtons.length >= 16) {
                    setTimeout(() => {
                        startGame();
                    }, 100);
                }
            } else {
                // 匹配失败
                // 视觉钩子：仅加一个纯展示用 class，不影响任何判断与数据
                selectedButtons.forEach(btn => btn.classList.add('wrong'));
                buzz([45]);
                setTimeout(() => {
                    selectedButtons.forEach(btn => {
                        btn.classList.remove('selected');
                        btn.classList.remove('wrong');
                    });
                    selectedButtons = [];
                }, 1000);
            }
        }

        // 更新计数
        function updateCounts() {
            const matched = matchedWords.size;
            const total = Object.keys(document.dict).length;
            document.getElementById('matchedCount').textContent = matched;
            document.getElementById('totalCount').textContent = total;

            // 进度条（纯视觉，写 CSS 变量，不新增 DOM）
            const hint = document.querySelector('.hint');
            if (hint) {
                hint.style.setProperty('--progress', total > 0 ? Math.min(100, (matched / total) * 100) + '%' : '0%');
            }
        }

        // 计数徽章弹一下（纯视觉）
        function pulseCount() {
            const el = document.getElementById('matchedCount');
            if (!el) return;
            el.classList.remove('bump');
            void el.offsetWidth; // 强制重排以便重播动画
            el.classList.add('bump');
        }

        // 导出已记住的单词
        function exportWords() {
            const words = [...matchedWords];
            const content = words.map(word => {
                const meaning = getChineseMeaning(word);
                return `${word}: ${meaning}`;
            }).join('\n');

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '已记住单词.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 清空记忆
        function clearMemory() {
            if (confirm('确定要清空所有已记住的单词吗？')) {
                if (confirm('真的要清空？')) {
                    if (confirm('确定？')) {
                        matchedWords.clear();
                        saveMatchedWords();
                        alert('记忆已清空！');
                        updateCounts();
                    }
                }
            }
        }

        function clickVibrate(ms = 30) {
            // 真震动（移动设备）
            if ('vibrate' in navigator) {
                navigator.vibrate(ms);
                return;
            }

            // 桌面端退化：body 抖一下
            const body = document.body;
            body.classList.remove('nudge');
            void body.offsetWidth;
            body.classList.add('nudge');
            setTimeout(() => body.classList.remove('nudge'), 160);
        }

        // 结构化振动：支持节奏数组；不支持时退化为单次轻震
        function buzz(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            } else {
                clickVibrate(30);
            }
        }

        document.addEventListener('click', e => {
            if (e.target.classList.contains('word-button')) {
                clickVibrate(40);   // 40ms 轻震
            }
        });

        // 页面加载时初始化
        fetchNoteInfo(dictName);
    </script>
</body>
</html>
